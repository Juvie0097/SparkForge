sparkforge {
  app-name = "SparkForge"
  master  = "local[*]"

  data {
    base-path        = "./data"
    raw-path         = ${sparkforge.data.base-path}"/raw"
    feature-path     = ${sparkforge.data.base-path}"/features"
    compact-path     = ${sparkforge.data.base-path}"/compact"
    checkpoint-path  = ${sparkforge.data.base-path}"/checkpoint"
  }

  generator {
    # Tunable so a laptop can run "small" and a cluster can run "big"
    num-users         = 100000
    num-merchants     = 5000
    num-devices       = 50000
    num-transactions  = 10000000
    days-back         = 35
    # Zipf-like skew: fraction of total volume concentrated on top hot users
    hot-user-fraction = 0.30
    hot-user-count    = 100
    # Output partitions for the raw write stage
    raw-write-partitions = 64
    # Inject NULL device_id rate to surface NULL-key skew at join time
    null-device-rate  = 0.02
  }

  features {
    windows-days = [1, 7, 30]
    # Cache pivot wide-table; switch to false to compare cost
    cache-wide-table = true
  }

  tuning {
    aqe-enabled                       = true
    aqe-coalesce-enabled              = true
    aqe-skew-join-enabled             = true
    advisory-partition-bytes          = "128MB"
    autobroadcast-threshold-bytes     = "32MB"
    shuffle-partitions                = 200
    files-max-partition-bytes         = "128MB"
    files-open-cost-bytes             = "4MB"
    sql-files-max-records-per-file    = 5000000
  }
}
